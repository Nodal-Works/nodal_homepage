<footer class="bg-light dark:bg-darkmode-light pb-4">
  <div class="container">
    <div class="row items-center py-6">
      <div class="lg:col-3 mb-4 text-center lg:mb-0 lg:text-left">
        <!-- navbar brand/logo -->
        <div class="order-0 flex items-center pl-10">
          <a class="navbar-brand inline-flex items-center h-12" href="{{ site.Home.RelPermalink }}">
            <div class="neumorphic-logo" role="img" aria-label="Nodal logo"></div>
          </a>
        </div>
      </div>
      <div class="lg:col-6 mb-4 text-center lg:mb-0">
        <p class="mb-0 text-text-light dark:text-darkmode-text-light text-sm">
          {{ site.Params.copyright | markdownify }}
        </p>
      </div>
      <div class="lg:col-3 mb-4 text-center lg:mb-0 lg:mt-0 lg:text-right">
        <ul class="social-icons">
          {{ range site.Data.social.main }}
            <li>
              <a
                target="_blank"
                aria-label="{{ .name }}"
                rel="nofollow noopener"
                href="{{ .link | safeURL }}">
                <i class="{{ .icon }}"></i>
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
</footer>
